<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="finalizar.css">
</head>
<body>
  <a href="../index.html"><i class="fas fa-arrow-left back-icon"></i></a>
  <div class="container">
    <h1>Finalizar Compra</h1>
    <form id="checkout-form">
      <div class="section">
        <h2>Endereço de Entrega</h2>
        <label for="state">Estado:</label>
        <select id="state" name="state" required>
          <option value="">Selecione o estado</option>
          <option value="SP">São Paulo</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="MG">Minas Gerais</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="BA">Bahia</option>
          <option value="PR">Paraná</option>
        </select>

        <label for="city">Cidade:</label>
        <input type="text" id="city" name="city" placeholder="Digite sua cidade" required>

        <label for="address">Endereço:</label>
        <input type="text" id="address" name="address" placeholder="Digite seu endereço completo" required>
      </div>

      <div class="section">
        <h2>Opções de Pagamento</h2>
        <div class="payment-options">
          <label>
            <input type="radio" name="payment" value="cartao" required>
            Cartão de Crédito
          </label>
          <label>
            <input type="radio" name="payment" value="boleto">
            Boleto Bancário
          </label>
          <label>
            <input type="radio" name="payment" value="pix">
            Pix
          </label>
        </div>
      </div>

      <button type="submit"><b>Finalizar Compra</b></button>
    </form>

    <div id="confirmation-message" class="hidden">
      <h2>Finalizada!</h2>
      <p>Obrigado por comprar conosco. Seu pedido está sendo processado.<br>Pedido nº <strong id="numero-pedido"></strong>.</p>
    </div>
  </div>
  <script src="finalizar.js"></script>
</body>
</html>
