<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PowerPlay - Administração</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #f4f4f4; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #222; color: white; }
        h1 { text-align: center; }
    </style>
</head>
<body>
<h1>PowerPlay - Produtos</h1>
<table>
    <thead>
    <tr>
        <th>ID</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="produto : ${produtos}">
        <td th:text="${produto.id}"></td>
        <td th:text="${produto.nome}"></td>
        <td th:text="${produto.categoria}"></td>
        <td th:text="${produto.preco}"></td>
        <td th:text="${produto.estoque}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
